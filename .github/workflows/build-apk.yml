name: Build Music Watch Party APK (MPV lock-screen)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Build APK (MPV lock-screen + background audio)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk Music-WP-117-TEST.apk
          ls -lh Music-WP-117-TEST.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Music-Watch-Party-APK
          path: Music-WP-117-TEST.apk

      - name: Release APK (download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v117-test
          name: Music Watch Party — v117 TEST (quality button + volume fix) [alag package: app.party.music.test]
          body: |
            **Music-WP-117-TEST.apk**

            Apni MOJOODA "Music Watch Party" app ke upar install karo —
            uninstall ki zaroorat NAHI. Chat / party data safe rehta hai
            (same package app.party.music + same key).

            Naya kya hai:
            - Lock screen / background par gaana chalta hai (MPV engine)
            - Lock/unlock par gaana wahin se chalta hai, restart nahi hota
            - Auto-next lock me bhi chalta hai
            - Lock ke baad gaana 1-2 second me shuru (fast start)
            - App band karne par stream cache clear
            - YouTube: pehle jaisa hi (video + lock screen)
            - AV1/MKV files MPV par nahi bheji jati (crash nahi hota)

            (v113 wale purane native libs ka test flop ho gaya tha - ab wapas naya MPV.)
          files: Music-WP-117-TEST.apk
