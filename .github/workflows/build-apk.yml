name: Build Music Watch Party APK (MPV lock-screen)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Build APK (MPV lock-screen + background audio)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk Music-Watch-Party-113-OLDLIBS.apk
          ls -lh Music-Watch-Party-113-OLDLIBS.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Music-Watch-Party-APK
          path: Music-Watch-Party-113-OLDLIBS.apk

      - name: Release APK (download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v113
          name: Music Watch Party — v113 (PURANA MPV/FFmpeg — test build)
          body: |
            **Music-Watch-Party-113-OLDLIBS.apk** — TEST BUILD

            Isme wahi purani native libraries hain jo Synkplay 0.23.0 me thi
            (purana FFmpeg v62 + wahi mpv core). Baqi sab kuch bilkul same hai —
            YouTube, party sync, lock screen, auto-next, chat.

            Apni MOJOODA "Music Watch Party" app ke upar install karo —
            uninstall ki zaroorat NAHI (same package app.party.music + same key).

            Purana v112 yahan maujood hai: releases/tag/v112
          files: Music-Watch-Party-113-OLDLIBS.apk
