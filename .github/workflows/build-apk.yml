name: Build silent keyboard GIF fallback (original app update)

on:
  push:
    branches: [ release/v117-mpv-final ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pinned extractor and original-package identity
        run: |
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  app/src/main/res/raw/ytdlp' | sha256sum -c -
          python - <<'PY'
          import re
          s=open('app/build.gradle.kts').read()
          assert re.search(r'applicationId\s*=\s*"app.party.music"',s)
          assert re.search(r'versionCode\s*=\s*126\b',s)
          assert '117-GIF-AUTO' in s
          PY
      - name: Sync and keyboard routing simulations
        run: |
          node tests/sync-policy.cjs
          node tests/keyboard-gif-routing.cjs
          node tests/keyboard-gif-fallback.cjs
      - name: JVM tests and signed original-package APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk Music-Watch-Party-117-GIF-AUTO.apk
          ls -lh Music-Watch-Party-117-GIF-AUTO.apk
      - name: Verify APK package, version and existing original signing certificate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging Music-Watch-Party-117-GIF-AUTO.apk > /tmp/badging.txt
          grep -F "package: name='app.party.music' versionCode='126' versionName='117-GIF-AUTO'" /tmp/badging.txt
          "$SIGNER" verify --print-certs Music-Watch-Party-117-GIF-AUTO.apk > /tmp/signature.txt
          grep -F '842e2d5518d28a1d0c3aff8a16646cead9c58a619884a21a6a41792c04bffb33' /tmp/signature.txt
          sha256sum Music-Watch-Party-117-GIF-AUTO.apk > SHA256SUMS.txt
      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: Music-Watch-Party-117-GIF-AUTO
          path: |
            Music-Watch-Party-117-GIF-AUTO.apk
            SHA256SUMS.txt
            app/build/reports/tests/testDebugUnitTest/
      - name: Publish user-authorized original app update
        if: github.ref == 'refs/heads/release/v117-mpv-final'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v117-gif-auto
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          name: 'Music Watch Party v117 — Silent GIF fallback'
          body: |
            Original-package update explicitly authorized by the user.
            Handset keyboard send + peer receive still need confirmation.
            Original app.party.music, versionCode 126, same signing certificate.
            Installs over final 124 without uninstall. Stable 124 cannot be installed over
            126 as a normal downgrade; do not uninstall to roll back or risk local data.

            Keyboard media: MIME signature detection; 12 MiB cap; bounded network reads;
            provider permission release; HTTP/DNS/TLS/timeout diagnostics; same-chat guard.
            Original Litterbox host remains first. If it fails, backup runs once automatically.
            User requested no popup, Retry button or intermediate fallback status. The backup
            is tmpfiles.org: public/unencrypted links expire after about ONE HOUR, including old chat history.
            Both upload routes verify downloaded bytes before dispatching the link.
            Built-in GIF option, MPV, sync, calls, notifications and HTML v45 unchanged.
            No fix for the separately deferred intermittent unwanted-playback issue.

            Sandbox: actual Kotlin uploader backup upload/download byte-match passed;
            primary returned HTTP412. This does not establish the handset's root cause.
            Local JVM/unit and routing simulations are not physical-device verification.
          files: |
            Music-Watch-Party-117-GIF-AUTO.apk
            SHA256SUMS.txt
