name: MPV023 ACT7 — original package, exact Synkplay 0.23.0 engine + rounded video corners + native presence + native room ears/hands (lock natively obeys stop/change)

on:
  push:
    branches: [ release/v117-mpv-final ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original identity; app logic unchanged except overlay + corner fix
        run: |
          # Against the approved MPV023 FINAL source only these files may differ:
          # ACT1: the native fullscreen toast column (new), its 2 wiring points and its unit test.
          # ACT2/ACT3: rounded MPV surface corners (MpvVideoPlayer) + holeJs bg field (WebBridge)
          #       + setRect mini/bg pass and onDestroy hardening (MainActivity).
          git diff --name-only d33ade5919b205b8c457a1281c15d4715db8b39e -- app/src | sort > /tmp/changed.txt
          printf '%s\n' \
            app/src/main/java/app/party/music/MainActivity.kt \
            app/src/main/java/app/party/music/NativeControl.kt \
            app/src/main/java/app/party/music/NativePresence.kt \
            app/src/main/java/app/party/music/MpvFullscreenControls.kt \
            app/src/main/java/app/party/music/MpvVideoPlayer.kt \
            app/src/main/java/app/party/music/WebBridge.kt \
            app/src/main/java/app/party/music/WpActivityFeed.kt \
            app/src/test/java/app/party/music/WpActivityItemTest.kt | sort | diff - /tmp/changed.txt
          git diff --exit-code d33ade5919b205b8c457a1281c15d4715db8b39e -- app/src/main/assets app/src/main/res app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "app.party.music"' app/build.gradle.kts
          grep -F 'versionName = "117-MPV023-ACT7"' app/build.gradle.kts
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  app/src/main/res/raw/ytdlp' | sha256sum -c -
      - name: Existing regression checks
        run: |
          node tests/sync-policy.cjs
          node tests/keyboard-gif-routing.cjs
          node tests/keyboard-gif-fallback.cjs
      - name: Set up Android SDK and command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare exact reference libraries and rebuild only the JNI adapter
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;35.0.0'
          python tests/mpv023/engine_swap.py prepare --work /tmp/mpv023
          python tests/mpv023/engine_swap.py build --work /tmp/mpv023 --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Build original-package base and JVM tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Substitute exact native bundle, align and sign original-package APK
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          BASE=app/build/outputs/apk/debug/app-debug.apk
          APK=Music-Watch-Party-117-MPV023-ACT7.apk
          "$SDK/aapt" dump badging "$BASE" | grep -F "package: name='app.party.music' versionCode='135' versionName='117-MPV023-ACT7'"
          python tests/mpv023/engine_swap.py swap --work /tmp/mpv023 --base "$BASE" --output /tmp/mpv023/unsigned.apk
          "$SDK/zipalign" -P 16 -f 4 /tmp/mpv023/unsigned.apk /tmp/mpv023/aligned.apk
          "$SDK/apksigner" sign --ks keystore/party.jks --ks-key-alias party --ks-pass pass:party123 --key-pass pass:party123 --out "$APK" /tmp/mpv023/aligned.apk
          "$SDK/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/mpv023/signature.txt
          grep -F '842e2d5518d28a1d0c3aff8a16646cead9c58a619884a21a6a41792c04bffb33' /tmp/mpv023/signature.txt
          "$SDK/zipalign" -c -P 16 4 "$APK"
          python tests/mpv023/engine_swap.py verify --work /tmp/mpv023 --base "$BASE" --output "$APK"
          "$SDK/aapt" dump badging "$APK" | grep -F "package: name='app.party.music' versionCode='135' versionName='117-MPV023-ACT7'"
          sha256sum "$APK" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Watch-Party-MPV023-ACT7
          path: |
            Music-Watch-Party-117-MPV023-ACT7.apk
            SHA256SUMS.txt
            tests/mpv023/manifest.json
            tests/mpv023/README.md
            app/build/reports/tests/testDebugUnitTest/
      - name: Publish original-package update (ACT7)
        if: github.ref == 'refs/heads/release/v117-mpv-final'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v117-mpv023-act7
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          name: 'Music Watch Party 117 — MPV023 ACT7 (native hands: lock screen obeys stop/change natively)'
          body: |
            Update over ACT6: original app.party.music / Music Watch Party.
            versionCode135 / 117-MPV023-ACT7. Same original signing certificate.
            NEW (ACT7): NATIVE HANDS - on the lock screen the forwarded room command
            is applied DIRECTLY on the native player (MpvVideoPlayer, the same proven
            path as the notification pause/play buttons) instead of only being handed
            to the frozen WebView. ACT6's ears worked but the hands did not: the page
            slept and the old song kept playing / auto-next fired. Now when the page
            is resumed the old tuned path runs unchanged (zero regression); when it
            is not, NativeControl applies pause/play/seek/sync and direct mp4/mp3
            loads natively (YouTube loads wait for unlock; presence keeps the member
            alive meanwhile). Room stop/change/seek now work on the lock screen.
            Old (ACT5): native presence beats every 25s with the music-service wake
            lock, so the tower never marks the user LEFT while a song plays.
            NEW: the MPV video surface now has ROUNDED CORNERS matching the page card
            native corner patches on EVERY Android version (fed by the page background color
            via holeJs), plus outline clip on Android 12+. Mini bar uses the small radius;
            fullscreen stays square. NEW: the surface is inset 2px inside the card so no
            thin edge sliver ("previous player") peeks above/below the frame.
            NEW: NATIVE PRESENCE - a small Paho MQTT client in the app (fed by the page
            config via YaarNative.wpPresence) refreshes the room member entry every 25s
            with the music-service wake lock, so the tower never marks the user LEFT
            while a song is playing on the lock screen. Clean LEFT on real leave/stop.
            Website side (v61): build bump only (hook unchanged from v60).
            OLD: swipe-away hardening - finishing the app now destroys the WebView and
            clears pending handlers (no more leaked stale page).
            Decorative only: playback, sync, controls, gestures and the activity column
            are untouched.
            Install over the original app; do NOT uninstall it. Original app data is retained.
            Android 8+ / arm64-v8a only (required by this native bundle).
            Exact nine native libraries from Synkplay Android v0.23.0 release:
            MPV v0.41.0-252-gc401ef9c3 / FFmpeg N-123143-g0540b42657.
            Existing Kotlin wrapper retained; unmodified JNI adapter source rebuilt
            against the matching FFmpeg62 ABI. Not a copy of Synkplay's full player.
            App source otherwise unchanged (only WpActivityFeed.kt, MpvFullscreenControls.kt,
            MpvVideoPlayer.kt, WebBridge.kt, MainActivity.kt + unit test differ from FINAL);
            resolver, sync, controls, GIF, calls and lifecycle unchanged.
            Published after user authorization; build checks do not prove handset playback.
            Provenance, pinned sources and GPL notices: tests/mpv023 in repository.
          files: |
            Music-Watch-Party-117-MPV023-ACT7.apk
            SHA256SUMS.txt
