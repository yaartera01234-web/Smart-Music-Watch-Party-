name: MPV023 TEST ONLY — exact Synkplay 0.23.0 native engine

on:
  push:
    branches: [ test/synkplay-023-mpv ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test-only identity and unchanged app logic
        run: |
          git diff --exit-code d33ade5919b205b8c457a1281c15d4715db8b39e -- app/src
          grep -F 'applicationId = "app.party.music.mpv023test"' app/build.gradle.kts
          grep -F 'versionName = "117-MPV023-TEST1"' app/build.gradle.kts
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  app/src/main/res/raw/ytdlp' | sha256sum -c -
      - name: Existing regression checks
        run: |
          node tests/sync-policy.cjs
          node tests/keyboard-gif-routing.cjs
          node tests/keyboard-gif-fallback.cjs
      - name: Prepare exact reference libraries and rebuild only the JNI adapter
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;35.0.0'
          python tests/mpv023/engine_swap.py prepare --work /tmp/mpv023
          python tests/mpv023/engine_swap.py build --work /tmp/mpv023 --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Build TEST base and JVM tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Substitute exact native bundle, align and sign TEST APK
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          BASE=app/build/outputs/apk/debug/app-debug.apk
          APK=Music-Watch-Party-MPV023-TEST1.apk
          "$SDK/aapt" dump badging "$BASE" | grep -F "package: name='app.party.music.mpv023test' versionCode='127' versionName='117-MPV023-TEST1'"
          python tests/mpv023/engine_swap.py swap --work /tmp/mpv023 --base "$BASE" --output /tmp/mpv023/unsigned.apk
          "$SDK/zipalign" -P 16 -f 4 /tmp/mpv023/unsigned.apk /tmp/mpv023/aligned.apk
          "$SDK/apksigner" sign --ks keystore/party.jks --ks-key-alias party --ks-pass pass:party123 --key-pass pass:party123 --out "$APK" /tmp/mpv023/aligned.apk
          "$SDK/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/mpv023/signature.txt
          grep -F '842e2d5518d28a1d0c3aff8a16646cead9c58a619884a21a6a41792c04bffb33' /tmp/mpv023/signature.txt
          "$SDK/zipalign" -c -P 16 4 "$APK"
          python tests/mpv023/engine_swap.py verify --work /tmp/mpv023 --base "$BASE" --output "$APK"
          "$SDK/aapt" dump badging "$APK" | grep -F "package: name='app.party.music.mpv023test' versionCode='127' versionName='117-MPV023-TEST1'"
          sha256sum "$APK" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MPV023-TEST1-only
          path: |
            Music-Watch-Party-MPV023-TEST1.apk
            SHA256SUMS.txt
            tests/mpv023/manifest.json
            tests/mpv023/README.md
            app/build/reports/tests/testDebugUnitTest/
      - name: TEST prerelease only — never promote or overwrite final
        if: github.ref == 'refs/heads/test/synkplay-023-mpv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v117-mpv023-test1
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: 'MPV023 TEST1 — Synkplay v0.23.0 native engine experiment'
          body: |
            TEST ONLY. Separate app.party.music.mpv023test / Party MPV023 TEST.
            Android 8+ / arm64-v8a. Original app and its data are not replaced.
            Exact nine native libraries from Synkplay v0.23.0 arm64 release:
            MPV v0.41.0-252-gc401ef9c3 / FFmpeg N-123143-g0540b42657.
            Existing Kotlin wrapper retained; its unmodified JNI adapter source rebuilt
            against matching FFmpeg62 libraries (original adapter required FFmpeg63).
            This is an engine-only comparison, not a copy of Synkplay's app/lifecycle/sync.
            Player settings, source resolver, sync, GIF, calls and chat app source unchanged.
            Old-device playback and repeated-song success NOT established by build checks.
            Close the original player before testing, then test first/second/third songs.
            Reference/provenance and GPL license notices are included in repository tests/mpv023.
          files: |
            Music-Watch-Party-MPV023-TEST1.apk
            SHA256SUMS.txt
