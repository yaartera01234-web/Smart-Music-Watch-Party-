name: Build v117 MPV FINAL (original package)

on:
  push:
    branches: [ release/v117-mpv-final ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pinned extractor and original-package identity
        run: |
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  app/src/main/res/raw/ytdlp' | sha256sum -c -
          python - <<'PY'
          import re
          s=open('app/build.gradle.kts').read()
          assert re.search(r'applicationId\s*=\s*"app.party.music"',s)
          assert re.search(r'versionCode\s*=\s*124\b',s)
          assert '117-MPV-FINAL' in s
          PY
      - name: Sync policy and simulated transport tests
        run: node tests/sync-policy.cjs
      - name: JVM tests and signed original-package APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk Music-Watch-Party-117-FINAL.apk
          ls -lh Music-Watch-Party-117-FINAL.apk
      - name: Verify APK package, version and existing original signing certificate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging Music-Watch-Party-117-FINAL.apk > /tmp/badging.txt
          grep -F "package: name='app.party.music' versionCode='124' versionName='117-MPV-FINAL'" /tmp/badging.txt
          "$SIGNER" verify --print-certs Music-Watch-Party-117-FINAL.apk > /tmp/signature.txt
          grep -F '842e2d5518d28a1d0c3aff8a16646cead9c58a619884a21a6a41792c04bffb33' /tmp/signature.txt
          sha256sum Music-Watch-Party-117-FINAL.apk > SHA256SUMS.txt
      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: Music-Watch-Party-117-FINAL
          path: |
            Music-Watch-Party-117-FINAL.apk
            SHA256SUMS.txt
            app/build/reports/tests/testDebugUnitTest/
      - name: Publish user-approved original-package final
        if: github.ref == 'refs/heads/release/v117-mpv-final'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v117-mpv-final
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          name: 'Music Watch Party v117 — MPV FINAL (original app update)'
          body: |
            Original-package update authorized by the user after TEST5 handset testing.
            Package: app.party.music · Label: Music Watch Party
            Version: 117-MPV-FINAL (internal versionCode 124)
            Android 7+ · arm64-v8a. Same signing certificate as original v115.
            Install over the original app; do not uninstall it first. TEST144 remains a separate app.

            Player/source code is unchanged from phone-tested TEST5 (d67e9e8).
            - On-device yt-dlp + MPV; YouTube iframe/media blocked inside the APK; Retry MPV only.
            - Default 144p, available manual qualities through 1080p, no Auto.
            - MP4/MKV/MP3/HLS through MPV; real audio tracks and MP3 artwork/fallback.
            - Immersive fullscreen, brightness/media-volume swipes and landscape cutout fix.
            - Original/16:9/16:10/4:3/2.35:1/Pan & Scan display modes.
            - Native sync: 8s rewind, slowdown and gentle correction, no fixed King.
            - 100 MiB forward cache budget (50+50 for separate video/audio), limited backward cache.
            - Existing background audio and message-notification services retained.
            - Browser interoperability uses the already-deployed original HTML v44.

            User-reported passes: APK/APK sync, HTML/APK MP4 and YouTube sync,
            fullscreen cutout fix and lock-screen continuous playback.
            These reports do not establish every device/network scenario.

            KNOWN ISSUE DEFERRED AT USER REQUEST: intermittent unwanted playback after
            Room Left / Recents removal / incoming room commands. No untested lifecycle
            or notification-service fix is included in this final promotion.
          files: |
            Music-Watch-Party-117-FINAL.apk
            SHA256SUMS.txt
